<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="480" height="480">
  <title>Robot de taller del CIFP Repélega</title>
  <defs>
    <clipPath id="shadeBody"><rect x="330" y="300" width="80" height="190"/></clipPath>
    <clipPath id="shadeHead"><rect x="350" y="170" width="50" height="130"/></clipPath>
    <path id="spark" d="M0 -30 Q6 -6 30 0 Q6 6 0 30 Q-6 6 -30 0 Q-6 -6 0 -30 Z"/>
  </defs>
  <ellipse cx="300" cy="548" rx="120" ry="11" fill="#1F2B4A" opacity="0.12"/>

  <!-- Piernas cortas y pies -->
  <rect x="246" y="470" width="34" height="50" rx="12" fill="#2C63B4"/>
  <rect x="320" y="470" width="34" height="50" rx="12" fill="#2C63B4"/>
  <rect x="232" y="512" width="58" height="26" rx="13" fill="#1F2B4A"/>
  <rect x="310" y="512" width="58" height="26" rx="13" fill="#1F2B4A"/>

  <!-- Brazo derecho, saludando (tubo con junta amarilla) -->
  <path d="M396 360 Q440 350 448 300" stroke="#2C63B4" stroke-width="22" fill="none" stroke-linecap="round"/>
  <circle cx="430" cy="346" r="11" fill="#FFC93C"/>
  <circle cx="449" cy="290" r="18" fill="#3A7BD5"/>

  <!-- Cuerpo: un pequeño depósito redondeado -->
  <rect x="200" y="300" width="200" height="185" rx="44" fill="#3A7BD5"/>
  <rect x="200" y="300" width="200" height="185" rx="44" fill="#2C63B4" clip-path="url(#shadeBody)"/>
  <!-- Aros del depósito -->
  <rect x="200" y="330" width="200" height="8" fill="#2C63B4" opacity="0.6"/>
  <rect x="200" y="450" width="200" height="8" fill="#2C63B4" opacity="0.6"/>

  <!-- La R amarilla del centro -->
  <circle cx="300" cy="398" r="38" fill="#FFC93C"/>
  <circle cx="300" cy="398" r="38" fill="none" stroke="#F2A922" stroke-width="5"/>
  <text x="300" y="417" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="54" font-weight="800" fill="#1F2B4A">R</text>

  <!-- Manómetro pequeño -->
  <circle cx="364" cy="358" r="16" fill="#FFFFFF" stroke="#1F2B4A" stroke-width="4"/>
  <path d="M364 358 L372 350" stroke="#E0473B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="364" cy="358" r="2.5" fill="#1F2B4A"/>

  <!-- Brazo izquierdo, sujetando una carpeta -->
  <path d="M204 360 Q168 380 170 420" stroke="#2C63B4" stroke-width="22" fill="none" stroke-linecap="round"/>
  <circle cx="178" cy="374" r="11" fill="#FFC93C"/>
  <g transform="rotate(-10 160 440)">
    <rect x="124" y="410" width="72" height="56" rx="6" fill="#FFC93C"/>
    <rect x="124" y="410" width="72" height="12" rx="6" fill="#F2A922"/>
    <rect x="136" y="432" width="44" height="5" rx="2.5" fill="#1F2B4A" opacity="0.5"/>
    <rect x="136" y="444" width="32" height="5" rx="2.5" fill="#1F2B4A" opacity="0.5"/>
  </g>
  <circle cx="172" cy="424" r="17" fill="#3A7BD5"/>

  <!-- Cuello -->
  <rect x="282" y="284" width="36" height="22" rx="6" fill="#1F2B4A"/>

  <!-- Cabeza con pantalla -->
  <circle cx="206" cy="232" r="13" fill="#FFC93C"/>
  <circle cx="394" cy="232" r="13" fill="#FFC93C"/>
  <rect x="212" y="176" width="176" height="114" rx="38" fill="#3A7BD5"/>
  <rect x="212" y="176" width="176" height="114" rx="38" fill="#2C63B4" clip-path="url(#shadeHead)"/>
  <rect x="234" y="194" width="132" height="78" rx="26" fill="#1F2B4A"/>
  <ellipse cx="276" cy="228" rx="13" ry="17" fill="#8FD3FF"/>
  <ellipse cx="324" cy="228" rx="13" ry="17" fill="#8FD3FF"/>
  <circle cx="280" cy="222" r="4" fill="#FFFFFF"/>
  <circle cx="328" cy="222" r="4" fill="#FFFFFF"/>
  <path d="M286 254 Q300 264 314 254" stroke="#8FD3FF" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Mástil y mini panel solar -->
  <rect x="295" y="146" width="10" height="34" rx="5" fill="#1F2B4A"/>
  <g transform="rotate(-12 300 140)">
    <rect x="232" y="118" width="136" height="38" rx="6" fill="#FFC93C"/>
    <rect x="238" y="123" width="124" height="28" rx="3" fill="#1F3A68"/>
    <g stroke="#5B8FD9" stroke-width="2">
      <line x1="269" y1="123" x2="269" y2="151"/>
      <line x1="300" y1="123" x2="300" y2="151"/>
      <line x1="331" y1="123" x2="331" y2="151"/>
      <line x1="238" y1="137" x2="362" y2="137"/>
    </g>
    <path d="M244 127 L262 127 L256 134 L244 134 Z" fill="#FFFFFF" opacity="0.35"/>
  </g>
</svg>
